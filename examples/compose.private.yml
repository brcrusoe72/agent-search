# Private stack overlay — Tor-anonymized search on port 3940.
#
# Adds:
#   1. Encrypted DNS (CoreDNS → Cloudflare DoT)
#   2. Tor proxy with Snowflake + obfs4 obfuscation
#   3. Isolated SearXNG instance routed exclusively through Tor
#   4. Network-level egress firewall (tor-internal has no internet route)
#
# Usage:
#   ./scripts/prepare-searxng.sh
#   docker compose -f docker-compose.yml -f examples/compose.private.yml up -d --build
#
# Result:
#   :3939 = direct (fast)
#   :3940 = anonymized via Tor (slower, private)

services:
  # === Extend the base encrypted-DNS service onto the Tor-only network ===
  dns:
    networks:
      agent-search:
        ipv4_address: 172.30.0.10
      tor-internal:
        ipv4_address: 172.31.0.10

  # Augment existing services with encrypted DNS
  searxng:
    dns:
      - 172.30.0.10
    depends_on:
      - dns

  # === Tor with Snowflake obfuscation ===
  tor:
    build:
      context: ./examples/torproxy
      args:
        TOR_BASE_IMAGE: ${TOR_BASE_IMAGE:-debian@sha256:f9c6a2fd2ddbc23e336b6257a5245e31f996953ef06cd13a59fa0a1df2d5c252}
    container_name: agent-search-tor
    networks:
      agent-search:
        ipv4_address: 172.30.0.20
      tor-internal:
        ipv4_address: 172.31.0.20
    dns:
      - 172.31.0.10
    restart: unless-stopped

  # === Private SearXNG — all traffic through Tor ===
  searxng-private:
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:4d7ed8b7035ecf827bd901ba6d32f5c32d8119bc09bb3cdafeb0ce58f1b951c1}
    container_name: agent-search-searxng-private
    volumes:
      - ./searxng:/etc/searxng:rw
      - ./searxng/settings.tor.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng-private:8080/
    networks:
      tor-internal:
        ipv4_address: 172.31.0.30  # NO direct egress — only path out is Tor
    dns:
      - 172.31.0.10
    depends_on:
      - tor
    restart: unless-stopped

  # Validates every private fetch destination and connects through Tor only.
  fetch-proxy-private:
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python@sha256:9e01bf1ae5db7649a236da7be1e94ffbbbdd7a93f867dd0d8d5720d9e1f89fab}
    container_name: agent-search-fetch-proxy-private
    environment:
      - FETCH_PROXY_TOR=tor:9050
      - FETCH_PROXY_MAX_CONCURRENT=64
    networks:
      tor-internal:
        ipv4_address: 172.31.0.31
    depends_on:
      - tor
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/live',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  browser-private:
    build:
      context: .
      dockerfile: Dockerfile.browser
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python@sha256:9e01bf1ae5db7649a236da7be1e94ffbbbdd7a93f867dd0d8d5720d9e1f89fab}
    container_name: agent-search-browser-private
    environment:
      - BROWSER_LOCAL_RENDER_ENABLED=1
      - BROWSER_PROXY_URL=http://fetch-proxy-private:8888
      - BROWSER_MAX_CONCURRENT=2
      - HOME=/tmp/browser-home
      - XDG_CACHE_HOME=/tmp/browser-cache
      - XDG_CONFIG_HOME=/tmp/browser-config
    networks:
      tor-internal:
        ipv4_address: 172.31.0.32
    dns:
      - 172.31.0.10
    depends_on:
      dns:
        condition: service_started
      fetch-proxy-private:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./examples/chromium-seccomp.json
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3941/live',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # TCP forwarder: host:3940 → api-private:3939
  api-private-frontend:
    image: ${SOCAT_IMAGE:-alpine/socat@sha256:44e7b87dfeddb0f999ce75eedfa140dc97ea5bf7decbd04b2cef6adb5cc331fe}
    container_name: agent-search-api-private-frontend
    command: ["-d", "TCP-LISTEN:3939,fork,reuseaddr", "TCP:api-private:3939"]
    ports:
      - "127.0.0.1:3940:3939"
    networks:
      agent-search:
        ipv4_address: 172.30.0.33
      tor-internal:
        ipv4_address: 172.31.0.34
    depends_on:
      - api-private
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 32m
    cpus: 0.25
    restart: unless-stopped

  api-private:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python@sha256:9e01bf1ae5db7649a236da7be1e94ffbbbdd7a93f867dd0d8d5720d9e1f89fab}
    container_name: agent-search-api-private
    environment:
      - SEARXNG_URL=http://searxng-private:8080
      - CACHE_TTL=3600
      - RATE_LIMIT=60
      - ADAPTERS_DIR=/app/adapters
      - AGENT_SEARCH_TOKEN=${AGENT_SEARCH_TOKEN:-}
      - FETCH_PROXY_URL=http://fetch-proxy-private:8888
      - HTTP_PROXY=http://fetch-proxy-private:8888
      - HTTPS_PROXY=http://fetch-proxy-private:8888
      - NO_PROXY=searxng-private,browser-private,fetch-proxy-private,tor,localhost,127.0.0.1
      - BROWSER_SERVICE_URL=http://browser-private:3941
      - BROWSER_SERVICE_MAX_CONCURRENT=2
      - NETWORK_ROUTE=tor
    depends_on:
      searxng-private:
        condition: service_started
      fetch-proxy-private:
        condition: service_healthy
      browser-private:
        condition: service_healthy
    volumes:
      - agent-search-data-tor:/app/data
      - ./adapters:/app/adapters:ro
    networks:
      tor-internal:
        ipv4_address: 172.31.0.33  # NO direct egress
    dns:
      - 172.31.0.10
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3939/live',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  agent-search:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  tor-internal:
    driver: bridge
    internal: true    # No NAT, no egress, no internet route
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  agent-search-data-tor:
