services:
  # DNS is the only public-network capability exposed to isolated workers.
  # Internal service names are pinned locally; public names use encrypted
  # upstream DNS. HTTP(S) still has to traverse fetch-proxy.
  dns:
    image: ${COREDNS_IMAGE:-coredns/coredns@sha256:b21d26b915e10acb5bc78715c1e8b6047ab2675389b2bcc18b3a6499d90e74c0}
    container_name: agent-search-dns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./examples/Corefile:/etc/coredns/Corefile:ro
    networks:
      agent-search:
        ipv4_address: 172.30.0.10
      fetch-internal:
        ipv4_address: 172.29.0.10
    read_only: true
    cap_drop: [ALL]
    # The pinned image runs as nonroot and needs only this capability to bind
    # the standard DNS port and execute its file-capability binary under NNP.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:4d7ed8b7035ecf827bd901ba6d32f5c32d8119bc09bb3cdafeb0ce58f1b951c1}
    container_name: agent-search-searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      agent-search:
        ipv4_address: 172.30.0.30
      fetch-internal:
        ipv4_address: 172.29.0.20
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    dns:
      - 172.30.0.10
    depends_on:
      dns:
        condition: service_started

  fetch-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python@sha256:9e01bf1ae5db7649a236da7be1e94ffbbbdd7a93f867dd0d8d5720d9e1f89fab}
    container_name: agent-search-fetch-proxy
    environment:
      - FETCH_PROXY_MAX_CONCURRENT=64
    networks:
      agent-search:
        ipv4_address: 172.30.0.31
      fetch-internal:
        ipv4_address: 172.29.0.21
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/live',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python@sha256:9e01bf1ae5db7649a236da7be1e94ffbbbdd7a93f867dd0d8d5720d9e1f89fab}
    container_name: agent-search-browser
    environment:
      - BROWSER_LOCAL_RENDER_ENABLED=1
      - BROWSER_PROXY_URL=http://fetch-proxy:8888
      - BROWSER_MAX_CONCURRENT=2
      - HOME=/tmp/browser-home
      - XDG_CACHE_HOME=/tmp/browser-cache
      - XDG_CONFIG_HOME=/tmp/browser-config
    depends_on:
      dns:
        condition: service_started
      fetch-proxy:
        condition: service_healthy
    dns:
      - 172.29.0.10
    networks:
      fetch-internal:
        ipv4_address: 172.29.0.22
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid
    cap_drop: [ALL]
    # Chromium's sandbox needs only chroot after creating its user namespace.
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./examples/chromium-seccomp.json
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3941/live',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Host ingress terminator; the API itself remains on the internal network.
  api-frontend:
    image: ${SOCAT_IMAGE:-alpine/socat@sha256:44e7b87dfeddb0f999ce75eedfa140dc97ea5bf7decbd04b2cef6adb5cc331fe}
    container_name: agent-search-api-frontend
    command: ["-d", "TCP-LISTEN:3939,fork,reuseaddr", "TCP:api:3939"]
    ports:
      - "127.0.0.1:3939:3939"
    networks:
      agent-search:
        ipv4_address: 172.30.0.32
      fetch-internal:
        ipv4_address: 172.29.0.24
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 32m
    cpus: 0.25
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python@sha256:9e01bf1ae5db7649a236da7be1e94ffbbbdd7a93f867dd0d8d5720d9e1f89fab}
    container_name: agent-search-api
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CACHE_TTL=3600
      - RATE_LIMIT=60
      - ADAPTERS_DIR=/app/adapters
      - AGENT_SEARCH_TOKEN=${AGENT_SEARCH_TOKEN:-}
      - BROWSER_SERVICE_URL=http://browser:3941
      - BROWSER_SERVICE_MAX_CONCURRENT=2
      - FETCH_PROXY_URL=http://fetch-proxy:8888
      - HTTP_PROXY=http://fetch-proxy:8888
      - HTTPS_PROXY=http://fetch-proxy:8888
      - NO_PROXY=searxng,browser,localhost,127.0.0.1
      - NETWORK_ROUTE=direct
    depends_on:
      dns:
        condition: service_started
      searxng:
        condition: service_started
      fetch-proxy:
        condition: service_healthy
      browser:
        condition: service_healthy
    dns:
      - 172.29.0.10
    volumes:
      - agent-search-data:/app/data
      - ./adapters:/app/adapters:ro
    networks:
      fetch-internal:
        ipv4_address: 172.29.0.23
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3939/live',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  agent-search:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  fetch-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  agent-search-data:
