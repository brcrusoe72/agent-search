[project]
name = "agent-search-mcp"
version = "1.0.0"
description = "MCP tool server for AgentSearch — self-hosted multi-engine search API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0", "httpx>=0.27.0"]

[project.scripts]
agent-search-mcp = "server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
